# KISS-ICP tuned for a 3D LiDAR on a slow UGV in snow. Feed it the DROR-filtered cloud.
data:
  deskew: true
  max_range: 60.0       # far returns in snowfall are mostly noise
  min_range: 1.5        # cut the near-sensor snow halo before DROR even runs
mapping:
  voxel_size: 0.5
  max_points_per_voxel: 20
adaptive_threshold:
  initial_threshold: 2.0
  min_motion_th: 0.05
registration:
  max_num_iterations: 500
  convergence_criterion: 0.0001
